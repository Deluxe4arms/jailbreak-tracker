    const TOOL_NAMES = ["Dopamine", "unc0ver", "Chimera", "Odyssey", "Taurine", "XinaA15", "meowbrek2", "palera1n", "checkra1n", "electra"];
    const TOOL_LINKS = {
      dopamine: "https://ellekit.space/dopamine/",
      unc0ver: "https://unc0ver.dev/",
      chimera: "https://theapplewiki.com/wiki/Chimera",
      odyssey: "https://theapplewiki.com/wiki/Odyssey",
      taurine: "https://taurine.app/",
      xinaa15: "https://theapplewiki.com/wiki/XinaA15",
      meowbrek2: "https://theapplewiki.com/wiki/Meowbrek2",
      palera1n: "https://palera.in/",
      checkra1n: "https://checkra.in/",
      electra: "https://theapplewiki.com/wiki/Electra"
    };
    const A12_IDS = new Set([
      "iPhone11,2","iPhone11,4","iPhone11,6","iPhone11,8",
      "iPad11,1","iPad11,2","iPad11,3","iPad11,4","iPad11,6","iPad11,7",
      "iPad8,1","iPad8,2","iPad8,3","iPad8,4","iPad8,5","iPad8,6","iPad8,7","iPad8,8"
    ]);
    const A12_RANGES = [
      { tool: "Chimera", lo: "12.0", hi: "12.1.2" },
      { tool: "unc0ver", lo: "12.0", hi: "14.8.1" },
      { tool: "Odyssey", lo: "13.0", hi: "13.7" },
      { tool: "Taurine", lo: "14.0", hi: "14.3" },
      { tool: "XinaA15", lo: "15.0", hi: "15.1.1" },
      { tool: "Dopamine", lo: "15.0", hi: "18.7.1" },
      { tool: "Dopamine", lo: "26.0", hi: "26.0.1" }
    ];
    const $ = (id) => document.getElementById(id);
    let currentRows = [];

    function parseVer(v) {
      const s = String(v).trim() === "27.01" ? "27.0.1" : String(v).trim();
      const m = s.match(/^(\d+)\.(\d+)(?:\.(\d+))?$/);
      return m ? [Number(m[1]), Number(m[2]), Number(m[3] || 0)] : [0, 0, 0];
    }
    function norm(v) {
      const s = String(v).trim();
      return s === "27.01" ? "27.0.1" : s;
    }
    function cmpRaw(a, b) {
      const pa = parseVer(a), pb = parseVer(b);
      for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
      return 0;
    }
    function inRange(v, lo, hi) { return cmpRaw(v, lo) >= 0 && cmpRaw(v, hi) <= 0; }
    function officialLink(name, fallback) {
      return TOOL_LINKS[String(name || "").toLowerCase()] || fallback || "";
    }
    function findToolName(text) {
      for (const name of TOOL_NAMES) {
        if (new RegExp("\\b" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(text)) return name;
      }
      return null;
    }
    function extractIosSections(text) {
      const chunks = String(text).split(/\n(?=#{1,3}\s+)/);
      const picked = chunks.filter((c) => /#{1,3}\s*(iOS|iPadOS)\b/i.test(c) || /^\s*(iOS|iPadOS)\b/i.test(c));
      return picked.join("\n") || text;
    }
    function fallbackFor(version) {
      if (cmpRaw(version, "12.0") < 0) {
        return { version, supported: false, status: "Not available on A12 / A12X", tool: "", url: "", source: "catalog" };
      }
      const tools = [];
      A12_RANGES.forEach((r) => { if (inRange(version, r.lo, r.hi) && !tools.includes(r.tool)) tools.push(r.tool); });
      if (tools.length) {
        return {
          version, supported: true,
          status: tools.join(" · ") + " for A12 / A12X",
          tool: tools[0], url: officialLink(tools[0]), source: "catalog"
        };
      }
      return { version, supported: false, status: "No public jailbreak for A12 / A12X", tool: "", url: "", source: "catalog" };
    }
    function versionHits(text) {
      const scoped = extractIosSections(text).replace(/<[^>]+>/g, " ");
      const hits = [];
      const lineRe = /(^|\n).{0,40}?\b((?:[1-9]|1[0-8]|26|27)\.\d+(?:\.\d+)?)\b.{0,180}/g;
      let m;
      while ((m = lineRe.exec("\n" + scoped))) {
        const version = norm(m[2]);
        const line = m[0];
        if (/tvOS|watchOS|audioOS|bridgeOS|visionOS/i.test(line) && !/iOS|iPadOS/i.test(line)) continue;
        const tool = findToolName(line);
        const denied = /no tool available|not (?:currently )?jailbreakable|no public jailbreak|unsupported/i.test(line);
        const allowed = !!(tool && !denied && /(yes|supported|semi-|jailbreakable)/i.test(line));
        hits.push({ version, tool: allowed ? tool : null, denied, allowed });
      }
      return hits;
    }

    async function fetchRaw(url) {
      const attempts = [
        url,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
        "https://corsproxy.io/?" + encodeURIComponent(url),
        "https://proxy.cors.dev/" + url
      ];
      let lastErr = "unreachable";
      for (const attempt of attempts) {
        try {
          const res = await fetch(attempt, { cache: "no-store" });
          if (!res.ok) { lastErr = "HTTP " + res.status; continue; }
          const txt = await res.text();
          if (txt && txt.trim().length > 0) return txt;
        } catch (err) { lastErr = err && err.message ? err.message : "network error"; }
      }
      throw new Error(lastErr);
    }

    async function wikiPage(page) {
      const api = "https://theapplewiki.com/w/api.php?action=parse&page=" + encodeURIComponent(page) + "&prop=wikitext|text&format=json&origin=*";
      try {
        const raw = await fetchRaw(api);
        const data = JSON.parse(raw);
        if (data.error) return "";
        const wikitext = (data.parse && data.parse.wikitext && (data.parse.wikitext["*"] || data.parse.wikitext)) || "";
        const html = (data.parse && data.parse.text && (data.parse.text["*"] || data.parse.text)) || "";
        return "# iOS\n" + wikitext + "\n# iPadOS\n" + html;
      } catch (e) {
        return "";
      }
    }

    async function checkWikis() {
      const pages = ["Jailbreak/12.x","Jailbreak/13.x","Jailbreak/14.x","Jailbreak/15.x","Jailbreak/16.x","Jailbreak/17.x","Jailbreak/18.x"];
      const texts = [];
      let successCount = 0;
      for (const page of pages) {
        const res = await wikiPage(page);
        if (res) {
          texts.push(res);
          successCount++;
        }
      }
      return { hits: texts.flatMap(versionHits), detail: `${successCount} charts verified` };
    }

    async function checkRedditWiki() {
      // Use AllOrigins wrapper to bypass Reddit client blocks
      const target = "https://www.reddit.com/r/jailbreak/wiki/index.json";
      try {
        const raw = await fetchRaw("https://api.allorigins.win/get?url=" + encodeURIComponent(target));
        const json = JSON.parse(raw);
        const data = JSON.parse(json.contents);
        const text = (data.data && (data.data.content_md || data.data.content_html)) || "";
        if (text) {
          return { hits: versionHits("# iOS\n" + text), detail: "r/jailbreak wiki scanned" };
        }
      } catch (e) {}

      // Fallback: If Reddit API refuses proxy access, fall back to fallback static state without failing the entire dashboard
      return { hits: [], detail: "r/jailbreak wiki rate-limited (catalog fallback used)" };
    }

    async function checkAppleDB() {
      const data = JSON.parse(await fetchRaw("https://api.appledb.dev/jailbreak/main.json"));
      const list = Array.isArray(data) ? data : Object.values(data);
      const hits = [];
      for (const jb of list) {
        const devices = [];
        (jb.compatibility || []).forEach((c) => (c.devices || []).forEach((d) => devices.push(d)));
        ((jb.info && jb.info.guide) || []).forEach((g) => (g.devices || []).forEach((d) => devices.push(d)));
        const hasA12 = devices.some((d) => A12_IDS.has(d)) || /A12/i.test(JSON.stringify(jb.info || {}));
        if (!hasA12) continue;
        const note = ((jb.info && jb.info.notes) || "") + " " + (((jb.info && jb.info.firmwares) || []).join(" "));
        (note.match(/\b(?:[1-9]|1[0-8]|26|27)\.\d+(?:\.\d+)?\b/g) || []).forEach((v) => {
          hits.push({ version: norm(v), tool: jb.name, allowed: false, denied: false, note: true });
        });
      }
      return { hits, detail: "AppleDB jailbreak records scanned" };
    }

    async function checkDopamineReadme() {
      const raw = await fetchRaw("https://cdn.jsdelivr.net/gh/opa334/Dopamine@master/README.md");
      return { hits: versionHits(raw), detail: "Dopamine README scanned" };
    }

    const SOURCES = [
      { name: "The Apple Wiki jailbreak charts", href: "https://theapplewiki.com/wiki/Category:Jailbreak", run: checkWikis },
      { name: "r/jailbreak wiki", href: "https://www.reddit.com/r/jailbreak/wiki/index", run: checkRedditWiki },
      { name: "AppleDB jailbreak database", href: "https://appledb.dev/jailbreak/Dopamine", run: checkAppleDB },
      { name: "Dopamine project README", href: "https://github.com/opa334/Dopamine", run: checkDopamineReadme }
    ];

    function mergeHits(allHits) {
      const map = new Map(VERSION_CATALOG.map((v) => [norm(v), fallbackFor(v)]));
      allHits.forEach((hit) => {
        const key = norm(hit.version);
        if (cmpRaw(key, "12.0") < 0) return;
        const cur = map.get(key) || fallbackFor(key);
        if (hit.allowed) {
          cur.supported = true;
          cur.tool = hit.tool || cur.tool;
          cur.url = officialLink(cur.tool);
          cur.status = (hit.tool || "Public tool") + " listed for A12 / A12X";
          cur.source = "live";
        } else if (hit.denied) {
          cur.supported = false; cur.tool = ""; cur.url = "";
          cur.status = "No tool available on public charts";
          cur.source = "live";
        }
        map.set(key, cur);
      });
      return [...map.values()];
    }

    function renderList(el, rows) {
      const q = ($("filter").value || "").trim().toLowerCase();
      const shown = q ? rows.filter((r) => (r.version + " " + r.status).toLowerCase().includes(q)) : rows;
      if (!shown.length) { el.innerHTML = '<div class="empty">None in this filter.</div>'; return; }
      el.innerHTML = shown.map((row) => {
        const extra = row.url ? '<br><a href="' + row.url + '" target="_blank" rel="noopener noreferrer">' + (row.tool || row.url) + "</a>" : "";
        return '<div class="row"><span class="ver">' + row.version + '</span><span class="st">' + row.status + extra + "</span></div>";
      }).join("");
    }

    function paint(rows) {
      currentRows = rows;
      const yes = rows.filter((v) => v.supported).sort((a, b) => cmpRaw(b.version, a.version));
      const no = rows.filter((v) => !v.supported).sort((a, b) => cmpRaw(b.version, a.version));
      $("yesHead").textContent = "Jailbreakable · " + yes.length;
      $("noHead").textContent = "Not jailbreakable · " + no.length;
      renderList($("yesList"), yes);
      renderList($("noList"), no);
      return { yes, no };
    }

    function renderSources(rows) {
      $("sourceList").innerHTML = rows.map((row) => {
        const state = row.error ? "Couldn’t read · " + row.error : (row.detail || "Checked");
        return '<div class="src"><div>' + row.name + '<br><a href="' + row.href + '" target="_blank" rel="noopener noreferrer">Open source</a></div><div>' + state + "</div></div>";
      }).join("");
    }

    async function refresh() {
      $("refresh").disabled = true;
      $("hud").dataset.state = "checking";
      $("headline").textContent = "SCANNING";
      $("subhead").textContent = "PUBLIC SOURCES";
      $("hudTitle").textContent = "Acquiring signal…";
      paint(VERSION_CATALOG.map(fallbackFor));
      const sourceRows = SOURCES.map((s) => ({ name: s.name, href: s.href, detail: "", error: "" }));
      renderSources(sourceRows);
      const bags = await Promise.all(SOURCES.map(async (src, i) => {
        try {
          const result = await src.run();
          sourceRows[i].detail = result.detail || "Checked";
          return result.hits || [];
        } catch (err) {
          sourceRows[i].error = err && err.message ? err.message : "failed";
          return [];
        }
      }));
      renderSources(sourceRows);
      const { yes } = paint(mergeHits(bags.flat()));
      $("checked").textContent = new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      if (yes[0]) {
        $("hud").dataset.state = "available";
        $("headline").textContent = "PATH FOUND";
        $("subhead").textContent = "iOS " + yes[0].version;
        $("hudTitle").textContent = "Newest A12 / A12X path: iOS " + yes[0].version;
        $("hudDetail").textContent = yes[0].status + ". The boards list every catalogued iOS release from 1.0 through the latest.";
      } else {
        $("hud").dataset.state = "none";
        $("headline").textContent = "NO LOCK";
        $("subhead").textContent = "KEEP SCANNING";
        $("hudTitle").textContent = "No jailbreak path listed";
        $("hudDetail").textContent = "No catalogued version is marked jailbreakable for A12 / A12X.";
      }
      $("refresh").disabled = false;
    }

    $("filter").addEventListener("input", () => paint(currentRows.length ? currentRows : VERSION_CATALOG.map(fallbackFor)));

    (function particles() {
      const c = $("fx"); const ctx = c.getContext("2d"); let dots = [];
      function resize() {
        c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        dots = Array.from({ length: 70 }, () => ({
          x: Math.random() * innerWidth, y: Math.random() * innerHeight,
          r: Math.random() * 1.6 + 0.3, v: Math.random() * 0.25 + 0.05,
          hue: Math.random() > .5 ? "rgba(0,243,255," : "rgba(255,43,214,"
        }));
      }
      function tick() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        dots.forEach((d) => {
          d.y -= d.v; if (d.y < -4) { d.y = innerHeight + 4; d.x = Math.random() * innerWidth; }
          ctx.fillStyle = d.hue + (0.25 + d.r / 4) + ")";
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        });
        requestAnimationFrame(tick);
      }
      resize(); addEventListener("resize", resize); tick();
    })();

    async function loadViews() {
      const url = "https://hits.dwyl.com/deluxe4arms/jailbreak-tracker.json";
      const attempts = [
        url,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
        "https://corsproxy.io/?" + encodeURIComponent(url)
      ];
      for (const attempt of attempts) {
        try {
          const res = await fetch(attempt, { cache: "no-store" });
          if (!res.ok) continue;
          const data = JSON.parse(await res.text());
          const n = Number(String(data.message || data.count || "").replace(/,/g, ""));
          if (Number.isFinite(n) && n >= 0) {
            $("views").textContent = n.toLocaleString();
            return;
          }
        } catch (e) {}
      }
      $("views").textContent = "unavailable";
    }

    $("refresh").addEventListener("click", refresh);
    paint(VERSION_CATALOG.map(fallbackFor));
    loadViews();
    refresh();
  </script>
